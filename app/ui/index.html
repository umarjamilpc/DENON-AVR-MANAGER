<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>DENON AVR MANAGER</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/styles.css?v=21" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("denon_theme") || "system";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand-block">
        <p class="brand">DENON AVR MANAGER</p>
        <p class="tagline">Setup Menu · env-configured AVR · live updates</p>
      </div>
      <div class="topbar-actions">
        <div class="theme-switch" role="group" aria-label="Color theme">
          <button type="button" data-theme-set="system" class="theme-btn">System</button>
          <button type="button" data-theme-set="light" class="theme-btn">Light</button>
          <button type="button" data-theme-set="dark" class="theme-btn">Dark</button>
        </div>
        <a class="docs-link" href="/docs" target="_blank" rel="noopener">API</a>
      </div>
    </header>

    <section class="status-panel">
      <div class="status-row">
        <p id="connect-status" class="status" role="status">Checking AVR…</p>
        <button type="button" id="reconnect-btn" class="btn-ghost">Retry</button>
      </div>
      <p class="live-hint">Changes apply in real time</p>
    </section>

    <nav class="tabs" id="tabs" aria-label="Views" hidden>
      <a class="tab active" id="tab-setup" href="/" data-view="setup">Setup Menu</a>
      <a class="tab" id="tab-info" href="/" data-view="info">Info</a>
      <span id="mode-pill" class="pill">Real-time</span>
    </nav>

    <main id="main" hidden>
      <section id="view-setup" class="view workspace" hidden>
        <aside class="nav-col">
          <p class="nav-caption">Setup</p>
          <div id="section-list" class="nav-list"></div>
        </aside>
        <div class="items-col">
          <p class="nav-caption" id="items-caption">Items</p>
          <div id="endpoint-list" class="item-list"></div>
        </div>
        <div class="editor-col">
          <div id="editor" class="editor" hidden>
            <header class="editor-head">
              <div>
                <h2 id="editor-title">—</h2>
                <p id="editor-meta" class="meta"></p>
              </div>
              <div class="editor-actions">
                <button type="button" id="reload-btn" class="btn-ghost">Reload</button>
              </div>
            </header>
            <p id="editor-banner" class="banner" hidden></p>
            <div id="action-panel" hidden></div>
            <form id="field-form" class="fields"></form>
          </div>
          <div id="editor-empty" class="empty-state">
            <p>Select a Setup Menu item</p>
          </div>
        </div>
      </section>

      <section id="view-info" class="view info-all" hidden>
        <article class="info-sheet">
          <header class="info-sheet-head">
            <div>
              <h2>Information</h2>
              <p id="info-note" class="status"></p>
            </div>
            <button type="button" id="info-refresh" class="btn-ghost">Refresh</button>
          </header>
          <div id="info-all-body" class="info-all-body"></div>
        </article>
      </section>
    </main>

    <footer class="foot">
      <span>DENON_HOST is set in docker-compose / environment</span>
      <span id="foot-host"></span>
    </footer>
  </div>
  <script src="/assets/app.js?v=29"></script>
</body>
</html>
