# DENON AVR MANAGER — run with Docker Compose
# 1. Edit DENON_HOST below to your receiver's LAN IP
# 2. docker compose up -d
# 3. Open http://127.0.0.1:8000/

services:
  denon-avr-manager:
    # Prefer the published multi-arch image (amd64 + arm64).
    # For a local build instead, comment "image:" and uncomment "build:".
    image: ghcr.io/umarjamilpc/denon-avr-manager:latest
    # build: .
    container_name: denon-avr-manager
    ports:
      - "8000:8000"
    environment:
      # Required — your Denon AVR IP or hostname on the LAN
      DENON_HOST: "192.168.1.50"
      # Optional — match your host user so /data files look familiar on disk.
      # Unraid: 99:100 (nobody:users). Linux desktop: run `id -u` / `id -g`.
      # Defaults inside the image are 10001:10001. /data is always chmod a+rwX
      # so the host can edit app-settings.json even if PUID differs.
      PUID: "99"
      PGID: "100"
    volumes:
      # Persistent app settings (created automatically; RW for container + host)
      - /mnt/user/appdata/UMAR-NAS-DENON-AVR-MANAGER:/data
    restart: unless-stopped
    # Container must reach the AVR on your home network (same LAN / routed).
    # Do not set user: here — entrypoint needs root briefly to fix /data permissions.
